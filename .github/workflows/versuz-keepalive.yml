name: Versuz keep-alive

on:
  schedule:
    # UTC for 9 AM to 9 PM Central; shift at DST.
    - cron: '3-59/10 0-2,15-23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-versuz:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Get the keep-alive script from the repo.
      - name: Check out the repo
        uses: actions/checkout@v5

      # Ping Versuz once and write one row to the ping table.
      - name: Ping Versuz
        env:
          VERSUZ_API_BASE_URL: ${{ vars.VERSUZ_API_BASE_URL }}
          VERSUZ_PING_PATH: ${{ vars.VERSUZ_PING_PATH }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 versuz/keepalive/keepalive.py
