name: Bible API probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-bible-api:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # One read-only call, saved to Supabase.
      - name: List Bibles once
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 bible/api_probe/api_probe.py
