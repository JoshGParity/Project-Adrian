name: Garmin activity file read test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-garmin-activity-file:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # fitdecode reads Garmin's FIT files.
      - name: Install fitdecode
        run: python3 -m pip install fitdecode==0.11.0

      # Save the saved file's records to Supabase.
      - name: Read the activity file
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 garmin/activity_file_test/read_activity_file.py
