name: Stocks discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-stocks:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Get the discovery script from the repo.
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Two Massive calls, two raw rows saved.
      - name: Save Massive responses
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 stocks/discovery/discovery.py
