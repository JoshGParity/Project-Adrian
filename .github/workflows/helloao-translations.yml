name: Helloao translation list test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-translations:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # One timed call, saved to Supabase.
      - name: Fetch the translation list
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 bible/helloao_probe/helloao_probe.py
