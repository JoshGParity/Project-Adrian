name: Garmin daily pull

on:
  schedule:
    # Daily at 10:00 AM Chicago, after the watch syncs.
    - cron: '0 10 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      day:
        description: 'One day to pull, as YYYY-MM-DD. Leave blank for yesterday.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pull-garmin-daily:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Get the pull script from the repo.
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # One row per day. The log shows days only.
      - name: Pull Garmin daily totals
        env:
          GARMIN_CONNECT_KEY: ${{ secrets.GARMIN_CONNECT_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PULL_DAY: ${{ inputs.day }}
        run: python3 garmin/daily/daily_pull.py
