name: Bible API verse-fetch test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-verses:
    runs-on: ubuntu-slim
    timeout-minutes: 35
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 56 timed calls, each saved to Supabase.
      - name: Make 56 calls
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 bible/verse_fetch/verse_fetch.py
