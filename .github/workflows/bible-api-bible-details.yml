name: Bible API Bible-details test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-bible-details:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 19 timed calls, each saved to Supabase.
      - name: Make 19 calls
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 bible/bible_details/bible_details.py
