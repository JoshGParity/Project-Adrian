name: Garmin activity file test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-garmin-activity-file:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Save one activity's detail and file to Supabase.
      - name: Save the activity file
        env:
          GARMIN_CONNECT_KEY: ${{ secrets.GARMIN_CONNECT_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 garmin/activity_file_test/activity_file_test.py
