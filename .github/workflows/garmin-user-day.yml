name: Garmin user day pull

on:
  workflow_dispatch:
    inputs:
      start_day:
        description: 'First day to pull, as YYYY-MM-DD. Leave both blank for the last 3 days.'
        required: false
        default: ''
      end_day:
        description: 'Last day to pull, as YYYY-MM-DD. Leave blank for the first day.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  pull-garmin-user-day:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # Get the pull script from the repo.
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Write each user's days and activities. Logs show days and counts only.
      - name: Pull Garmin user days
        env:
          GARMIN_CONNECT_KEY: ${{ secrets.GARMIN_CONNECT_KEY }}
          GARMIN_CONNECT_KEY_SYDNEY: ${{ secrets.GARMIN_CONNECT_KEY_SYDNEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          START_DAY: ${{ inputs.start_day }}
          END_DAY: ${{ inputs.end_day }}
        run: python3 garmin/user_day/user_day_pull.py
