name: Bible API flag-explorer test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore-flags:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # 38 timed calls, each saved to Supabase.
      - name: Make 38 calls
        env:
          BIBLE_API_KEY: ${{ secrets.BIBLE_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 bible/flag_explorer/flag_explorer.py
