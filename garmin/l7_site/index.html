<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L7 Days Fitness Check In</title>
<style>
html, body { margin: 0; background: #c8ecff; }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script>
// Stands in for the claude.ai page runtime: loads the five JSON files next to this page.
window.dash = (function () {
  const names = ['days', 'activities', 'highlights', 'week', 'activity_hr'];
  const sources = {};
  const drawers = {};
  const listeners = [];
  names.forEach((name) => { sources[name] = {status: 'loading', data: null}; });

  function run(name) {
    const fn = drawers[name];
    if (!fn) return;
    document.querySelectorAll('[data-draw="' + name + '"]').forEach((el) => fn(el));
  }
  function runAll() {
    Object.keys(drawers).forEach(run);
    listeners.forEach((cb) => cb());
  }
  function load() {
    names.forEach((name) => {
      fetch(name + '.json', {cache: 'no-cache'})
        .then((r) => { if (!r.ok) throw new Error(name + '.json: HTTP ' + r.status); return r.json(); })
        .then((rows) => { sources[name] = {status: 'ok', data: rows}; })
        .catch((e) => { sources[name] = {status: 'error', data: null, error: String(e)}; })
        .then(runAll);
    });
    let width = window.innerWidth;
    window.addEventListener('resize', () => {
      if (window.innerWidth === width) return;
      width = window.innerWidth;
      run('chart');
    });
  }

  return {
    colors: ['#e83828', '#f8c818'],
    data: (name) => sources[name],
    draw: (name, fn) => { if (fn) drawers[name] = fn; run(name); },
    onData: (cb) => { listeners.push(cb); },
    load: load
  };
})();
</script>

/* hero */
.wr-top { margin: 0 -10px; }
.wr-world-hero { height: 196px; border-bottom: 3px solid var(--k); }
.wr-world-hero .wr-l-clouds { top: 74px; }
.wr-sp-a { left: 34%; } .wr-sp-b { left: 52%; }
.wr-hud { position: absolute; left: 12px; right: 12px; top: 14px; z-index: 3; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.wr-title { margin: 0; font-size: 15px; line-height: 1.4; color: #fff; text-shadow: 2px 0 0 var(--k), -2px 0 0 var(--k), 0 2px 0 var(--k), 0 -2px 0 var(--k), 2px 2px 0 var(--k), -2px 2px 0 var(--k), 2px -2px 0 var(--k), -2px -2px 0 var(--k), 0 4px 0 var(--k); text-wrap: balance; }
.wr-dates { margin: 0; font-size: 10px; color: var(--k); background: var(--gold); padding: 4px 8px; box-shadow: 0 0 0 2px var(--k), 4px 4px 0 2px var(--k); }

/* NES dialog panels */
.wr-tile, .wr-hl, .wr-chart, .wr-tablewrap, .wr-card { background: var(--panel); border: 3px solid var(--line); box-shadow: 0 0 0 3px var(--k), 4px 4px 0 3px var(--k); }
.wr-h2 { margin: 0; font-size: 15px; line-height: 1.4; color: #fff; text-shadow: 2px 0 0 var(--k), -2px 0 0 var(--k), 0 2px 0 var(--k), 0 -2px 0 var(--k), 2px 2px 0 var(--k), -2px 2px 0 var(--k), 2px -2px 0 var(--k), -2px -2px 0 var(--k); display: flex; align-items: center; gap: 10px; }
.wr-h2::before { content: ""; width: 10px; height: 10px; background: var(--gold); box-shadow: 0 0 0 2px var(--k); flex: none; }

.wr-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 4px; }
.wr-tile { padding: 10px 6px; min-width: 0; text-align: center; }
.wr-tile::after { display: none; }
.wr-pv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.wr-pv > div { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wr-pv b { font-weight: normal; font-size: 15px; line-height: 1.3; color: #fff; font-variant-numeric: tabular-nums; }
.wr-pv .win b { color: var(--red); }
.wr-pv i { font-style: normal; font-size: 10px; color: var(--muted); }
.wr-tag { font-size: 10px; padding: 0 4px; box-shadow: 0 0 0 2px var(--k); }
.wr-tag.p1 { background: var(--p1); color: #fff; } .wr-tag.p2 { background: var(--p2); color: var(--k); }
@media (max-width: 560px) { .wr-tiles { grid-template-columns: 1fr; } .wr-tile { display: grid; grid-template-columns: 6.5em 1fr; align-items: center; text-align: left; } .wr-pv { margin-top: 0; } }
.wr-k { font-size: 10px; color: var(--muted); }
.wr-v { font-size: 20px; line-height: 1.2; margin-top: 6px; color: var(--red); font-variant-numeric: tabular-nums; }
#tile-steps .wr-v { color: #78c8ff; }
#tile-acts .wr-v { color: var(--gold); }
.wr-n { font-size: 10px; color: var(--muted); margin-top: 4px; }
.wr-unit { font-size: 10px; margin-left: 2px; }

.wr-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; padding: 4px; }
.wr-hl { padding: 12px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.wr-hl h2 { margin: 0; font-size: 10px; color: var(--gold); }
.wr-hl-rows { display: flex; flex-direction: column; gap: 14px; }
.wr-hl-p { font-size: 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.wr-hl-p::before { font-size: 10px; padding: 0 4px; box-shadow: 0 0 0 2px var(--k); }
.wr-hl-rows > div:nth-child(odd) .wr-hl-p::before { content: "P1"; background: var(--p1); color: #fff; }
.wr-hl-rows > div:nth-child(even) .wr-hl-p::before { content: "P2"; background: var(--p2); color: var(--k); }
.wr-badges { display: flex; flex-wrap: wrap; gap: 8px; }
.wr-badge { flex: 1 1 120px; min-width: 0; padding: 8px; background: var(--panel2); box-shadow: inset 0 0 0 2px #4a54a0; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
.wr-badge-t { font-size: 10px; color: var(--muted); }
.wr-badge > b { font-weight: normal; font-size: 15px; line-height: 1.3; color: #fff; }
.wr-badge > span { font-size: 10px; color: var(--muted); }
.wr-badge.is-gold .wr-badge-t { color: var(--gold); }
.wr-badge.is-low .wr-badge-t { color: #78c8ff; }
.wr-badge.is-hot .wr-badge-t, .wr-badge.is-hot > b { color: var(--red); }

.wr-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.wr-seg { display: inline-flex; flex-wrap: wrap; gap: 10px; padding: 2px; }
.wr-seg button, .wr-nav button { font: inherit; font-size: 10px; cursor: pointer; border: 2px solid var(--line); background: var(--panel); color: #fff; box-shadow: 0 0 0 2px var(--k), 3px 3px 0 2px var(--k); padding: 6px 10px; min-height: 32px; }
.wr-seg button[aria-pressed="true"] { background: var(--gold); color: var(--k); }
.wr-seg[aria-label="Person"] button:nth-child(1)[aria-pressed="true"] { background: var(--p1); color: #fff; }
.wr-seg[aria-label="Person"] button:nth-child(2)[aria-pressed="true"] { background: var(--p2); color: var(--k); }
.wr-seg button:active, .wr-nav button:active { translate: 3px 3px; box-shadow: 0 0 0 2px var(--k); }
.wr button:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }

.wr-chart { position: relative; min-height: 220px; padding: 10px; margin: 0 4px; }
.wr-chart svg { display: block; width: 100%; height: auto; overflow: visible; shape-rendering: crispEdges; }
.wr-chart text { font-family: 'WrPixel', monospace; font-size: 10px; fill: var(--muted); }
.wr-chart text.wr-val { fill: #fff; paint-order: stroke; stroke: var(--k); stroke-width: 3px; }
.wr-chart rect.wr-bar { stroke: var(--k); stroke-width: 2px; }
.wr-chart line, .wr-chart path.domain { stroke: #4a54a0; }
.wr-win { fill: none; stroke: #f5ecd2; stroke-width: 1.6; }
.wr-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 10px; color: var(--muted); margin-top: 10px; }
.wr-sw { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; box-shadow: 0 0 0 2px var(--k); }
.wr-tip { position: absolute; pointer-events: none; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 0 0 2px var(--k), 4px 4px 0 2px var(--k); padding: 6px 8px; font-size: 10px; color: #fff; white-space: nowrap; z-index: 5; }
.wr-tip strong { display: block; font-weight: normal; margin-bottom: 2px; color: var(--gold); }

.wr-tablewrap { overflow-x: auto; margin: 0 4px; }
.wr-table { border-collapse: collapse; width: 100%; font-size: 10px; font-variant-numeric: tabular-nums; }
.wr-table th, .wr-table td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 2px solid #343c7c; font-weight: normal; }
.wr-table th:first-child, .wr-table td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); }
.wr-table th { color: var(--gold); }
.wr-table tbody tr:hover td { background: var(--panel2); }
.wr-none { color: var(--muted); }

.wr-nav { display: flex; align-items: center; gap: 12px; padding: 2px; }
.wr-nav button { width: 36px; padding: 0; background: var(--gold); color: var(--k); border-color: #fff; }
.wr-nav button:disabled { background: var(--panel); color: #4a54a0; cursor: default; }
.wr-count { font-size: 10px; color: var(--k); font-variant-numeric: tabular-nums; min-width: 4em; text-align: center; }
.wr-track { display: grid; grid-auto-flow: column; grid-auto-columns: 100%; overflow-x: auto; scroll-snap-type: x mandatory; gap: 20px; scrollbar-width: none; padding: 4px 10px 12px 4px; }
.wr-track::-webkit-scrollbar { display: none; }
.wr-card { scroll-snap-align: start; padding: 0 0 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.wr-card > :not(.wr-world) { margin-left: 12px; margin-right: 12px; }
.wr-card-t { font-size: 15px; line-height: 1.4; color: var(--gold); }
.wr-card-s { font-size: 10px; color: var(--muted); margin-top: -10px; }
.wr-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }
.wr-kv { font-size: 15px; line-height: 1.3; margin-top: 2px; font-variant-numeric: tabular-nums; }
.wr-kv .wr-unit { color: var(--muted); }
.wr-zbar { display: flex; height: 14px; overflow: hidden; background: var(--panel2); box-shadow: 0 0 0 2px var(--k); border: 2px solid #fff; }
.wr-zlist { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; font-size: 10px; font-variant-numeric: tabular-nums; }
.wr-zlist div { min-width: 0; }
.wr-zlist b { display: block; font-weight: normal; font-size: 10px; color: #fff; }
.wr-zlist span { color: var(--muted); }
.wr-hr { border: 2px dashed #4a54a0; min-height: 60px; display: grid; place-items: center; color: var(--muted); font-size: 10px; }
.wr-hrchart svg { display: block; width: 100%; height: auto; margin-top: 6px; background: var(--panel2); box-shadow: 0 0 0 2px var(--k); border: 2px solid #fff; box-sizing: border-box; }
.wr-hrchart text { font-family: 'WrPixel', monospace; font-size: 9px; fill: var(--muted); }

/* activity card scenes */
.wr-world-card { height: 100px; border-bottom: 3px solid var(--line); box-shadow: 0 3px 0 var(--k); margin-bottom: 4px; }
.wr-world-card .wr-l-clouds { top: 6px; }
.wr-world-card .wr-l-far { bottom: 22px; }
.wr-world-card .wr-l-near { bottom: 22px; }
.wr-world-card .wr-l-ground { height: 32px; }
.wr-world-card .wr-sp { left: calc(50% - 20px); bottom: 24px; }
.wr-world-card .wr-sp.ride { left: calc(50% - 30px); bottom: 21px; }

@media (prefers-reduced-motion: no-preference) {
  .wr-world { --t: 1; }
  .wr-world.is-run { --t: .45; }
  .wr-world.is-ride { --t: .26; }
  .wr-l-clouds { animation: wr-pan288 calc(60s * var(--t)) linear infinite; }
  .wr-l-far { animation: wr-pan240 calc(40s * var(--t)) linear infinite; }
  .wr-l-near { animation: wr-pan240 calc(16s * var(--t)) linear infinite; }
  .wr-l-ground { animation: wr-pan48 calc(1.6s * var(--t)) linear infinite; }
  .wr-sp.p1 { width: 54px; height: 64.5px; background-size: 216px 64.5px; margin-left: -7.5px; }
.wr-sp.p1.ride { width: 75px; height: 67.5px; background-size: 300px 67.5px; }
.wr-sp.p1.walk { animation-name: wr-f204; } .wr-sp.p1.run { animation-name: wr-f204; } .wr-sp.p1.ride { animation-name: wr-f288; }
@keyframes wr-f204 { to { background-position-x: -216px; } } @keyframes wr-f288 { to { background-position-x: -300px; } }

<script>
window.wr = window.wr || {metric: 'sleep', unit: 'mi', act: 0};
window.wrFmt = {
  day: (s) => d3.utcFormat('%a %-d')(d3.utcParse('%Y-%m-%d')(s)),
  hm: (m) => m == null ? null : Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'),
  int: d3.format(','),
  reduced: () => !window.matchMedia('(prefers-reduced-motion: no-preference)').matches
};

document.querySelectorAll('.wr [data-metric]').forEach((b) => {
  b.addEventListener('click', () => {
    window.wr.metric = b.dataset.metric;
    document.querySelectorAll('.wr [data-metric]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    dash.draw('chart');
  });
});
document.querySelectorAll('.wr [data-unit]').forEach((b) => {
  b.addEventListener('click', () => {
    window.wr.unit = b.dataset.unit;
    document.querySelectorAll('.wr [data-unit]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    dash.draw('acts');
  });
});

function wrTile(name, field, fmt) {
  dash.draw(name, (el) => {
    const s = dash.data('week');
    const r = s.status === 'ok' ? s.data[0] : null;
    el.textContent = r && r[field] != null ? fmt(r[field]) : '—';
  });
}
function wrPeople() {
  const s = dash.data('days');
  return s.status === 'ok' ? Array.from(new Set(s.data.map((r) => r.first_name))) : [];
}
function wrPair(el, vals) {
  el.replaceChildren();
  const best = d3.max(vals, (v) => v.n);
  vals.forEach((v, i) => {
    const c = document.createElement('div');
    if (vals.length > 1 && v.n != null && v.n === best) c.className = 'win';
    const tag = document.createElement('span');
    tag.className = 'wr-tag p' + (i % 2 + 1);
    tag.textContent = v.name;
    const b = document.createElement('b');
    b.textContent = v.text;
    const n = document.createElement('i');
    n.textContent = v.sub || '';
    c.append(tag, b, n);
    el.appendChild(c);
  });
}
dash.draw('t-sleep', (el) => {
  const s = dash.data('days');
  if (s.status !== 'ok') { el.textContent = '—'; return; }
  wrPair(el, wrPeople().map((p) => {
    const rows = s.data.filter((r) => r.first_name === p);
    const got = rows.filter((r) => r.sleep_total_minutes != null);
    const avg = got.length ? Math.round(d3.mean(got, (r) => r.sleep_total_minutes)) : null;
    return {name: p, n: avg, text: avg == null ? '—' : window.wrFmt.hm(avg), sub: got.length + ' of ' + rows.length + ' nights'};
  }));
});
dash.draw('t-steps', (el) => {
  const s = dash.data('days');
  if (s.status !== 'ok') { el.textContent = '—'; return; }
  wrPair(el, wrPeople().map((p) => {
    const got = s.data.filter((r) => r.first_name === p && r.steps != null);
    const avg = got.length ? Math.round(d3.mean(got, (r) => r.steps)) : null;
    return {name: p, n: avg, text: avg == null ? '—' : window.wrFmt.int(avg), sub: 'per day'};
  }));
});
dash.draw('t-acts', (el) => {
  const s = dash.data('activities');
  if (s.status !== 'ok') { el.textContent = '—'; return; }
  let people = wrPeople();
  if (!people.length) people = Array.from(new Set(s.data.map((r) => r.first_name))).sort();
  wrPair(el, people.map((p) => {
    const k = s.data.filter((r) => r.first_name === p).length;
    return {name: p, n: k, text: String(k), sub: 'this week'};
  }));
});
dash.onData(() => { if (dash.data('days').status === 'ok') dash.draw('t-acts'); });
wrTile('t-range', 'range_label', (v) => v);
dash.onData(() => {
  if (dash.data('week').status !== 'ok') return;
  document.querySelectorAll('.wr').forEach((w) => w.classList.add('wr-anim'));
});

</script>

<script>
dash.draw('chart', (el) => {
  const s = dash.data('days');
  const F = window.wrFmt;
  if (s.status !== 'ok') { el.textContent = s.status === 'error' ? 'Daily data failed to load.' : '—'; return; }
  el.replaceChildren();
  const all = s.data;
  const metric = window.wr.metric;
  const colors = dash.colors;
  const people = Array.from(new Set(all.map((r) => r.first_name)));
  const days = Array.from(new Set(all.map((r) => r.day))).sort();
  const byKey = new Map(all.map((r) => [r.day + '|' + r.first_name, r]));
  const multi = people.length > 1;
  const W = Math.max(280, el.clientWidth || 320), H = 250, m = {t: 22, r: 2, b: multi ? 44 : 30, l: 2};
  const x0 = d3.scaleBand().domain(days).range([m.l, W - m.r]).padding(0.22);
  const x1 = d3.scaleBand().domain(people).range([0, x0.bandwidth()]).padding(multi ? 0.12 : 0);
  const bw = x1.bandwidth();
  const rot = bw < 30;
  if (rot) m.t = 46;
  const val = (sel, cx, yy, s) => rot
    ? sel.append('text').attr('class', 'wr-val').attr('transform', `translate(${cx + 4},${yy - 5}) rotate(-90)`).attr('text-anchor', 'start').text(s)
    : sel.append('text').attr('class', 'wr-val').attr('x', cx).attr('y', yy - 6).attr('text-anchor', 'middle').text(s);
  const stages = [['sleep_deep_minutes', 'Deep', '#5868f0'], ['sleep_light_minutes', 'Light', '#58b0f8'], ['sleep_rem_minutes', 'REM', '#a868f8'], ['sleep_awake_minutes', 'Awake', '#f8b8c8']];
  const field = {bbh: 'body_battery_high', bbl: 'body_battery_low', steps: 'steps', cal: 'calories_active'}[metric];
  const mcolor = {bbh: '#58c858', bbl: '#f89038', steps: '#4888f8', cal: '#e23a33'}[metric];
  const pcolor = (p) => mcolor || colors[people.indexOf(p) % colors.length];
  const dayMax = new Map(days.map((d) => [d, d3.max(people, (p) => { const r = byKey.get(d + '|' + p); return r && field ? r[field] : null; })]));
  const popac = (p, day) => {
    if (!mcolor || !multi || day == null) return 1;
    const r = byKey.get(day + '|' + p);
    return r && r[field] != null && r[field] === dayMax.get(day) ? 1 : 0.4;
  };
  let y;
  if (metric === 'sleep') {
    const max = d3.max(all, (r) => d3.sum(stages, (st) => r[st[0]] || 0)) || 1;
    y = d3.scaleLinear().domain([0, max]).range([H - m.b, m.t]);
  } else if (metric === 'bbh' || metric === 'bbl') {
    y = d3.scaleLinear().domain([0, 100]).range([H - m.b, m.t]);
  } else if (metric === 'cal') {
    y = d3.scaleLinear().domain([0, d3.max(all, (r) => r.calories_active) || 1]).range([H - m.b, m.t]);
  } else {
    y = d3.scaleLinear().domain([0, d3.max(all, (r) => r.steps) || 1]).range([H - m.b, m.t]);
  }
  const labels = {sleep: 'Sleep by stage per night', bbh: 'Body Battery high per day', bbl: 'Body Battery low per day', steps: 'Steps per day', cal: 'Active calories per day'};
  const svg = d3.select(el).append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', labels[metric] + ', by person, last 7 days');
  if (metric === 'bbh' || metric === 'bbl') {
    [25, 50, 75, 100].forEach((v) => svg.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y(v)).attr('y2', y(v)).style('stroke', 'var(--cds-chart-grid)'));
  }
  svg.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', H - m.b).attr('y2', H - m.b).style('stroke', 'var(--cds-chart-axis)');
  const showVals = bw >= 10;
  const g = svg.selectAll('g.wr-d').data(days).join('g').attr('class', 'wr-d').attr('transform', (d) => `translate(${x0(d)},0)`);
  g.append('text').attr('x', x0.bandwidth() / 2).attr('y', H - m.b + (multi ? 30 : 17)).attr('text-anchor', 'middle').text((d) => F.day(d));
  g.each(function (day) {
    const gg = d3.select(this);
    people.forEach((p) => {
      const r = byKey.get(day + '|' + p);
      const px = x1(p), cx = px + bw / 2;
      if (multi) {
        const wf = metric === 'sleep' ? 'sleep_total_minutes' : field;
        const best = d3.max(people, (q) => { const rq = byKey.get(day + '|' + q); return rq ? rq[wf] : null; });
        if (r && r[wf] != null && r[wf] === best) gg.append('circle').attr('class', 'wr-win').attr('cx', cx).attr('cy', H - m.b + 9).attr('r', 8);
        gg.append('text').attr('x', cx).attr('y', H - m.b + 13).attr('text-anchor', 'middle').text(p.slice(0, 1));
      }
      const empty = () => {
        if (metric === 'sleep' && !multi) {
          const t = gg.append('text').attr('x', cx).attr('y', H - m.b - 22).attr('text-anchor', 'middle');
          t.append('tspan').attr('x', cx).text('No');
          t.append('tspan').attr('x', cx).attr('dy', 13).text('data');
        } else {
          gg.append('text').attr('x', cx).attr('y', H - m.b - 6).attr('text-anchor', 'middle').text('–');
        }
      };
      if (metric === 'sleep') {
        if (!r || r.sleep_total_minutes == null) { empty(); return; }
        let acc = 0;
        stages.forEach(([k, , c]) => {
          const v = r[k] || 0;
          gg.append('rect').attr('x', px).attr('width', bw).attr('y', y(acc + v)).attr('height', Math.max(0, y(acc) - y(acc + v))).attr('class', 'wr-bar').style('fill', c);
          acc += v;
        });
        if (showVals) val(gg, cx, y(acc), r.sleep_total);
      } else {
        const v = r ? r[field] : null;
        if (v == null) { empty(); return; }
        gg.append('rect').attr('x', px).attr('width', bw).attr('y', y(v)).attr('height', Math.max(1, y(0) - y(v))).attr('class', 'wr-bar').style('fill', pcolor(p)).style('opacity', popac(p, day));
        if (showVals) val(gg, cx, y(v), metric === 'steps' ? (v / 1000).toFixed(1) + 'k' : metric === 'cal' && v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v);
      }
    });
  });
  const tip = document.createElement('div');
  tip.className = 'wr-tip';
  tip.hidden = true;
  el.appendChild(tip);
  const line = (p, r) => {
    if (!r) return p + ': no data';
    if (metric === 'sleep') return r.sleep_total_minutes == null ? p + ': no sleep data' : p + ': ' + r.sleep_total + ' (deep ' + r.sleep_deep_minutes + ', light ' + r.sleep_light_minutes + ', REM ' + r.sleep_rem_minutes + ', awake ' + r.sleep_awake_minutes + ' min)';
    const v = r[field];
    return p + ': ' + (v == null ? 'no data' : metric === 'steps' ? F.int(v) + ' steps' : metric === 'cal' ? F.int(v) + ' active cal' : v);
  };
  const show = (day) => {
    tip.replaceChildren();
    const h = document.createElement('strong');
    h.textContent = F.day(day);
    tip.appendChild(h);
    people.forEach((p) => { const dv = document.createElement('div'); dv.textContent = line(p, byKey.get(day + '|' + p)); tip.appendChild(dv); });
    tip.hidden = false;
    const scale = el.clientWidth / W;
    const left = (x0(day) + x0.bandwidth() / 2) * scale - tip.offsetWidth / 2;
    tip.style.left = Math.max(0, Math.min(el.clientWidth - tip.offsetWidth, left)) + 'px';
    tip.style.top = '0px';
  };
  g.append('rect').attr('x', -x0.step() * x0.paddingInner() / 2).attr('width', x0.step()).attr('y', 0).attr('height', H).style('fill', 'transparent').style('cursor', 'pointer')
    .on('pointerenter', (e, d) => show(d)).on('click', (e, d) => show(d)).on('pointerleave', () => { tip.hidden = true; });
  const leg = document.createElement('div');
  leg.className = 'wr-legend';
  const items = metric === 'sleep' ? stages.map((st) => [st[1], st[2]]) : (mcolor && multi) ? [['Winner', mcolor, 1], ['Other', mcolor, 0.4]] : people.map((p) => [p, pcolor(p), 1]);
  items.forEach(([name, c, o]) => {
    const sp = document.createElement('span');
    const sw = document.createElement('i');
    sw.className = 'wr-sw';
    sw.style.background = c;
    sw.style.opacity = o || 1;
    sp.append(sw, name);
    leg.appendChild(sp);
  });
  el.appendChild(leg);
});

dash.draw('hl-sleep', (el) => {
  const s = dash.data('highlights');
  if (s.status !== 'ok') { el.textContent = s.status === 'error' ? 'Failed to load.' : '—'; return; }
  el.replaceChildren();
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const mark = (e, field, who) => { e.dataset.source = 'highlights'; e.dataset.field = field; e.dataset.where = 'first_name=' + encodeURIComponent(who); return e; };
  s.data.forEach((r) => {
    const box = mk('div');
    box.appendChild(mk('div', 'wr-hl-p', r.first_name));
    const row = mk('div', 'wr-badges');
    [['Best night', 'best_night', 'best_night_day', 'is-gold'], ['Worst night', 'worst_night', 'worst_night_day', 'is-low']].forEach(([label, v, d, cls]) => {
      const b = mk('div', 'wr-badge ' + cls);
      b.appendChild(mk('div', 'wr-badge-t', label));
      b.appendChild(mark(mk('b', null, r[v] == null ? 'No data' : r[v]), v, r.first_name));
      b.appendChild(mark(mk('span', null, r[d] == null ? '' : r[d]), d, r.first_name));
      row.appendChild(b);
    });
    box.appendChild(row);
    el.appendChild(box);
  });
});
dash.draw('hl-hr', (el) => {
  const s = dash.data('highlights');
  if (s.status !== 'ok') { el.textContent = s.status === 'error' ? 'Failed to load.' : '—'; return; }
  el.replaceChildren();
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const mark = (e, field, who) => { e.dataset.source = 'highlights'; e.dataset.field = field; e.dataset.where = 'first_name=' + encodeURIComponent(who); return e; };
  s.data.forEach((r) => {
    const box = mk('div');
    box.appendChild(mk('div', 'wr-hl-p', r.first_name));
    const b = mk('div', 'wr-badge is-hot');
    b.appendChild(mk('div', 'wr-badge-t', 'Max HR'));
    const v = mk('b');
    if (r.hr_max == null) { v.textContent = 'No activities'; }
    else { v.appendChild(mark(mk('span', null, String(r.hr_max)), 'hr_max', r.first_name)); v.appendChild(mk('span', 'wr-unit', 'bpm')); }
    b.appendChild(v);
    b.appendChild(mark(mk('span', null, r.hr_max_when == null ? '' : r.hr_max_when), 'hr_max_when', r.first_name));
    box.appendChild(b);
    el.appendChild(box);
  });
});

dash.draw('who', (el) => {
  const s = dash.data('days');
  el.replaceChildren();
  if (s.status !== 'ok') return;
  const people = Array.from(new Set(s.data.map((r) => r.first_name)));
  const who = people.includes(window.wr.who) ? window.wr.who : people[0];
  people.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = p;
    b.setAttribute('aria-pressed', String(p === who));
    b.addEventListener('click', () => { window.wr.who = p; dash.draw('who'); dash.draw('table'); });
    el.appendChild(b);
  });
});

function wrActWho() {
  const s = dash.data('days');
  const people = s.status === 'ok' ? Array.from(new Set(s.data.map((r) => r.first_name))) : [];
  return {people, who: people.includes(window.wr.actWho) ? window.wr.actWho : people[0]};
}
window.wrActWho = wrActWho;

dash.draw('act-who', (el) => {
  el.replaceChildren();
  const {people, who} = wrActWho();
  people.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = p;
    b.setAttribute('aria-pressed', String(p === who));
    b.addEventListener('click', () => { window.wr.actWho = p; dash.draw('act-who'); dash.draw('acts'); });
    el.appendChild(b);
  });
});

dash.draw('table', (tb) => {
  const s = dash.data('days');
  const F = window.wrFmt;
  tb.replaceChildren();
  if (s.status !== 'ok') {
    const td = tb.insertRow().insertCell();
    td.colSpan = 12;
    td.textContent = s.status === 'error' ? 'Daily data failed to load.' : '—';
    return;
  }
  const cols = ['sleep_total', 'sleep_deep_minutes', 'sleep_light_minutes', 'sleep_rem_minutes', 'sleep_awake_minutes', 'body_battery_high', 'body_battery_low', 'steps', 'calories_total', 'calories_active'];
  const people = Array.from(new Set(s.data.map((r) => r.first_name)));
  const who = people.includes(window.wr.who) ? window.wr.who : people[0];
  s.data.filter((r) => r.first_name === who).forEach((r) => {
    const tr = tb.insertRow();
    tr.dataset.key = encodeURIComponent(r.day) + ',' + encodeURIComponent(r.first_name);
    const d = tr.insertCell();
    d.textContent = F.day(r.day);
    tr.insertCell().textContent = r.first_name;
    cols.forEach((c) => {
      const td = tr.insertCell();
      const v = r[c];
      if (v == null) { td.textContent = c === 'sleep_total' ? 'No data' : '—'; td.className = 'wr-none'; }
      else td.textContent = typeof v === 'number' && v >= 1000 ? F.int(v) : String(v);
    });
  });
});
</script>

<script>
// Heart rate for each minute of one activity, over its zone bands.
function wrHrChart(r, hrByActivity, zones, mk) {
  const wrap = mk('div', 'wr-hrchart');
  wrap.appendChild(mk('div', 'wr-k', 'Heart rate by minute'));
  const rows = hrByActivity ? (hrByActivity.get(String(r.activity_id)) || []) : null;
  if (!rows || !rows.length) {
    wrap.appendChild(mk('div', 'wr-hr', rows ? 'No heart-rate minutes for this activity.' : 'Loading heart rate…'));
    return wrap;
  }
  const W = 320, H = 150, m = {t: 8, r: 8, b: 20, l: 28};
  const lastMinute = d3.max(rows, (h) => h.minute);
  const byMinute = new Map(rows.map((h) => [h.minute, h.heart_rate]));
  const points = d3.range(0, lastMinute + 1).map((mi) => ({minute: mi, hr: byMinute.has(mi || 1) ? byMinute.get(mi || 1) : null}));
  const floors = [1, 2, 3, 4, 5].map((z) => r['zone' + z + '_floor_bpm']);
  const hasFloors = floors.every((f) => f != null);
  const hrs = rows.map((h) => h.heart_rate).filter((v) => v != null);
  const lo = Math.min(d3.min(hrs), hasFloors ? floors[0] : Infinity) - 6;
  const hi = Math.max(d3.max(hrs), hasFloors ? floors[3] : -Infinity) + 6;
  const x = d3.scaleLinear([0, lastMinute], [m.l, W - m.r]);
  const y = d3.scaleLinear([lo, hi], [H - m.b, m.t]);
  const svg = d3.create('svg').attr('viewBox', '0 0 ' + W + ' ' + H).attr('role', 'img')
    .attr('aria-label', 'Heart rate by minute for ' + lastMinute + ' minutes, from ' + d3.min(hrs) + ' to ' + d3.max(hrs) + ' bpm');
  if (hasFloors) {
    const edges = [lo].concat(floors, [hi]);
    zones.forEach(([, , c], i) => {
      const bottom = Math.max(edges[i], lo), top = Math.min(edges[i + 1], hi);
      if (top <= bottom) return;
      svg.append('rect').attr('x', m.l).attr('width', W - m.l - m.r).attr('y', y(top)).attr('height', y(bottom) - y(top)).attr('fill', c).attr('opacity', 0.32);
    });
    floors.forEach((f, i) => {
      if (f <= lo || f >= hi) return;
      svg.append('text').attr('x', m.l - 4).attr('y', y(f) + 3).attr('text-anchor', 'end').text(f);
      svg.append('text').attr('x', W - m.r - 3).attr('y', y(f) - 3).attr('text-anchor', 'end').text('Z' + (i + 1));
    });
  } else {
    y.ticks(4).forEach((t) => svg.append('text').attr('x', m.l - 4).attr('y', y(t) + 3).attr('text-anchor', 'end').text(t));
  }
  x.ticks(Math.min(6, lastMinute)).filter(Number.isInteger).forEach((t) => {
    svg.append('text').attr('x', x(t)).attr('y', H - 6).attr('text-anchor', 'middle').text(t === 0 ? '0 min' : t);
  });
  const line = d3.line().defined((p) => p.hr != null).x((p) => x(p.minute)).y((p) => y(p.hr)).curve(d3.curveStepBefore);
  svg.append('path').datum(points).attr('d', line).attr('fill', 'none').attr('stroke', '#1a1220').attr('stroke-width', 5).attr('stroke-linejoin', 'miter');
  svg.append('path').datum(points).attr('d', line).attr('fill', 'none').attr('stroke', '#ffffff').attr('stroke-width', 2.5).attr('stroke-linejoin', 'miter');
  wrap.appendChild(svg.node());
  return wrap;
}
</script>
<script>
dash.draw('acts', (el) => {
  const s = dash.data('activities');
  if (s.status !== 'ok') { el.textContent = s.status === 'error' ? 'Activities failed to load.' : '—'; return; }
  el.replaceChildren();
  const actInfo = window.wrActWho();
  const actWho = actInfo.who;
  const actP = Math.max(0, actInfo.people.indexOf(actWho));
  const rows = s.data.filter((r) => !actWho || r.first_name === actWho);
  if (!rows.length) { el.textContent = 'No activities this week.'; return; }
  const unit = window.wr.unit;
  const colors = dash.colors;
  const hrSource = dash.data('activity_hr') || {status: 'loading'};
  const hrByActivity = hrSource.status === 'ok' ? d3.group(hrSource.data, (h) => String(h.activity_id)) : null;
  const nav = document.createElement('div');
  nav.className = 'wr-nav';
  const prev = document.createElement('button');
  prev.type = 'button'; prev.textContent = '◀'; prev.setAttribute('aria-label', 'Previous activity');
  const count = document.createElement('span');
  count.className = 'wr-count';
  const next = document.createElement('button');
  next.type = 'button'; next.textContent = '▶'; next.setAttribute('aria-label', 'Next activity');
  nav.append(prev, count, next);
  const track = document.createElement('div');
  track.className = 'wr-track';
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const mark = (e, field, id) => { e.dataset.source = 'activities'; e.dataset.field = field; e.dataset.where = 'activity_id=' + encodeURIComponent(id); return e; };
  rows.forEach((r, i) => {
    const card = mk('article', 'wr-card');
    card.id = 'act-' + r.activity_id;
    card.setAttribute('aria-label', 'Activity ' + (i + 1) + ' of ' + rows.length);
    card.appendChild(mark(mk('div', 'wr-card-t', r.activity_name || r.start), r.activity_name ? 'activity_name' : 'start', r.activity_id));
    if (r.activity_name) card.appendChild(mark(mk('div', 'wr-card-s', r.start), 'start', r.activity_id));
    const kind = /cycl|bik|ride|spin/i.test(r.activity_type || '') ? 'ride' : /run|jog/i.test(r.activity_type || '') ? 'run' : 'walk';
    const scene = mk('div', 'wr-world wr-world-card is-' + kind);
    scene.setAttribute('aria-hidden', 'true');
    ['clouds', 'far', 'near', 'ground'].forEach((l) => scene.appendChild(mk('i', 'wr-l wr-l-' + l)));
    scene.appendChild(mk('i', 'wr-sp ' + (actP > 0 ? 'p2 ' : 'p1 ') + kind));
    card.insertBefore(scene, card.firstChild);
    const kpis = mk('div', 'wr-kpis');
    const distField = unit === 'km' ? 'distance_km' : 'distance_mi';
    const kpi = (label, field, val, suffix) => {
      const box = mk('div');
      box.appendChild(mk('div', 'wr-k', label));
      const v = mk('div', 'wr-kv');
      v.appendChild(mark(mk('span', null, val), field, r.activity_id));
      if (suffix) v.appendChild(mk('span', 'wr-unit', suffix));
      box.appendChild(v);
      kpis.appendChild(box);
    };
    kpi('Distance', distField, Number(r[distField]).toFixed(2), unit);
    kpi('Duration', 'duration', r.duration);
    kpi('Calories', 'calories', String(r.calories));
    kpi('Avg HR', 'avg_hr', String(r.avg_hr), 'bpm');
    kpi('Max HR', 'max_hr', String(r.max_hr), 'bpm');
    kpi('Min HR', 'min_hr', String(r.min_hr), 'bpm');
    card.appendChild(kpis);
    const zones = [['Below Z1', 'below_zone1_minutes', '#7078a8'], ['Z1', 'zone1_minutes', '#9890b8'], ['Z2', 'zone2_minutes', '#4888f8'], ['Z3', 'zone3_minutes', '#58c858'], ['Z4', 'zone4_minutes', '#f8b838'], ['Z5', 'zone5_minutes', '#e23a33']];
    const zwrap = mk('div');
    zwrap.appendChild(mk('div', 'wr-k', 'Minutes by HR zone'));
    const bar = mk('div', 'wr-zbar');
    bar.setAttribute('role', 'img');
    bar.setAttribute('aria-label', zones.map(([n, f]) => n + ' ' + r[f] + ' min').join(', '));
    bar.style.marginTop = '6px';
    const total = d3.sum(zones, ([, f]) => r[f] || 0) || 1;
    zones.forEach(([, f, c]) => { const seg = mk('div'); seg.style.width = ((r[f] || 0) / total * 100) + '%'; seg.style.background = c; bar.appendChild(seg); });
    zwrap.appendChild(bar);
    const zl = mk('div', 'wr-zlist');
    zl.style.marginTop = '8px';
    zones.forEach(([n, f]) => {
      const c = mk('div');
      c.appendChild(mk('span', null, n));
      c.appendChild(mark(mk('b', null, String(r[f])), f, r.activity_id));
      zl.appendChild(c);
    });
    zwrap.appendChild(zl);
    card.appendChild(zwrap);
    card.appendChild(wrHrChart(r, hrByActivity, zones, mk));
    track.appendChild(card);
  });
  el.append(nav, track);
  const n = rows.length;
  const setIdx = (i) => {
    window.wr.act = Math.max(0, Math.min(n - 1, i));
    count.textContent = (window.wr.act + 1) + ' / ' + n;
    prev.disabled = window.wr.act === 0;
    next.disabled = window.wr.act === n - 1;
  };
  const go = (i) => {
    setIdx(i);
    track.scrollTo({left: window.wr.act * (track.clientWidth + parseFloat(getComputedStyle(track).columnGap || 0)), behavior: window.wrFmt.reduced() ? 'auto' : 'smooth'});
  };
  prev.addEventListener('click', () => go(window.wr.act - 1));
  next.addEventListener('click', () => go(window.wr.act + 1));
  track.addEventListener('scroll', () => {
    const step = track.clientWidth + parseFloat(getComputedStyle(track).columnGap || 0);
    if (step > 0) setIdx(Math.round(track.scrollLeft / step));
  }, {passive: true});
  setIdx(Math.min(window.wr.act, n - 1));
  requestAnimationFrame(() => { const step = track.clientWidth + parseFloat(getComputedStyle(track).columnGap || 0); track.scrollLeft = window.wr.act * step; });
});
</script>
